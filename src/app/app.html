<div class="todo-app">
  <header class="header">
    <h1>{{ title() }}</h1>
    <div class="input-container">
      <input
        type="text"
        class="new-todo"
        placeholder="O que precisa ser feito?"
        [(ngModel)]="newTodoText"
        (keyup.enter)="addTodo()"
        autofocus
      />
      <button class="add-btn" (click)="addTodo()" [disabled]="!newTodoText().trim()">
        Adicionar
      </button>
    </div>
    <div class="tags-selector">
      <span class="tags-label">Tags:</span>
      <div class="tags-list">
        <button
          *ngFor="let tag of availableTags"
          class="tag-btn"
          [class.selected]="isTagSelected(tag.name)"
          [style.--tag-color]="tag.color"
          (click)="toggleTag(tag.name)"
        >
          {{ tag.name }}
        </button>
      </div>
    </div>
  </header>

  <section class="main" *ngIf="todos().length > 0">
    <ul class="todo-list">
      <li *ngFor="let todo of filteredTodos()" [class.completed]="todo.completed">
        <div class="view">
          <input
            class="toggle"
            type="checkbox"
            [id]="'todo-' + todo.id"
            [checked]="todo.completed"
            (change)="toggleTodo(todo.id)"
            [attr.aria-label]="'Marcar tarefa como ' + (todo.completed ? 'incompleta' : 'completa')"
          />
          <label [for]="'todo-' + todo.id" (dblclick)="toggleTodo(todo.id)">
            <span class="todo-text">{{ todo.text }}</span>
            <div class="todo-tags" *ngIf="todo.tags && todo.tags.length > 0">
              <span
                *ngFor="let tag of todo.tags"
                class="todo-tag"
                [style.background-color]="getTagColor(tag)"
              >
                {{ tag }}
              </span>
            </div>
          </label>
          <button class="destroy" (click)="deleteTodo(todo.id)" [attr.aria-label]="'Excluir tarefa ' + todo.text">×</button>
        </div>
      </li>
    </ul>
  </section>

  <footer class="footer" *ngIf="todos().length > 0">
    <span class="todo-count">
      <strong>{{ activeCount() }}</strong>
      {{ activeCount() === 1 ? 'tarefa' : 'tarefas' }} restante{{ activeCount() === 1 ? '' : 's' }}
    </span>

    <ul class="filters">
      <li>
        <a [class.selected]="filter() === 'all'" (click)="setFilter('all')">Todas</a>
      </li>
      <li>
        <a [class.selected]="filter() === 'active'" (click)="setFilter('active')">Ativas</a>
      </li>
      <li>
        <a [class.selected]="filter() === 'completed'" (click)="setFilter('completed')">Concluídas</a>
      </li>
    </ul>

    <div class="tag-filters" *ngIf="availableTags.length > 0">
      <span class="filter-label">Filtrar por:</span>
      <button
        *ngFor="let tag of availableTags"
        class="tag-filter-btn"
        [class.active]="tagFilter() === tag.name"
        [style.--tag-color]="tag.color"
        (click)="setTagFilter(tag.name)"
      >
        {{ tag.name }}
      </button>
    </div>

    <button class="clear-completed" (click)="clearCompleted()" *ngIf="completedCount() > 0">
      Limpar concluídas ({{ completedCount() }})
    </button>
  </footer>
</div>
